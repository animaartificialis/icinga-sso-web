name: Build Debian package

# Builds a drop-in .deb of this patched icinga-sso-web so users can install the
# OIDC redirect fix without cloning and building themselves. The package name
# and layout match the official icinga-sso-web package; an epoch-bumped version
# (1:1.0.0+imatic1) makes apt/dpkg treat it as an upgrade over the official
# 1.0.0 (and its nightly snapshots). Architecture: all — one package fits every
# Debian/Ubuntu with a compatible icingaweb2.

on:
  workflow_dispatch:
  push:
    branches: [debian-package]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts fakeroot

      - name: Build the .deb
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p out
          # The on-disk filename escapes the epoch colon as %3a; hand the
          # release a clean, human-friendly asset name (version inside the
          # package stays 1:1.0.0+imatic1).
          cp ../icinga-sso-web_*_all.deb out/icinga-sso-web_1.0.0+imatic1_all.deb
          echo "=== package metadata ==="
          dpkg-deb -I out/icinga-sso-web_1.0.0+imatic1_all.deb
          echo "=== package contents ==="
          dpkg-deb -c out/icinga-sso-web_1.0.0+imatic1_all.deb

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: icinga-sso-web-deb
          path: out/*.deb
          if-no-files-found: error

      - name: Publish/refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="deb-v1.0.0+imatic1"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" out/*.deb \
            --title "icinga-sso-web 1.0.0 + OIDC redirect fix — Debian package" \
            --notes $'Drop-in Debian package of icinga-sso-web with the post-login OIDC redirect fix (PR #13).\n\n- Package: `icinga-sso-web`, version `1:1.0.0+imatic1`, Architecture `all`\n- Supersedes the official 1.0.0 (and nightly snapshots) via an epoch bump, so it installs as an upgrade in place.\n\nInstall:\n```\nsudo apt install ./icinga-sso-web_1.0.0+imatic1_all.deb\n# or\nsudo dpkg -i icinga-sso-web_1.0.0+imatic1_all.deb\n```\n\nUnofficial rebuild — not affiliated with Icinga GmbH.'
